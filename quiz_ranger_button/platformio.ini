; 佛學知識王 - 藍牙搶答按鈕 (ESP32-C3 SuperMini)
; 以「藍牙鍵盤(BLE HID)」方式連電腦,免驅動、任何瀏覽器都能收。

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; 用 NimBLE 版藍牙鍵盤,對 ESP32-C3 相容性最好、佔用 flash 較小
build_flags =
    -D USE_NIMBLE

lib_deps =
    t-vk/ESP32 BLE Keyboard @ ^0.3.2
    h2zero/NimBLE-Arduino @ ^1.4.2
